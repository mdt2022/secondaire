<c-row>
    <c-col xs="12">
        <c-card class="mb-4">
        <c-card-header>
            Ajouter / Modifier
        </c-card-header>
        <c-card-body>            
            <form [formGroup]="adminForm" (ngSubmit)="onSubmit()">
                <div class="row g-3">

                    <!-- Nom -->
                    <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="nom"
                        placeholder="Entrez le nom"
                    />
                    </div>

                    <!-- Prénom -->
                    <div class="col-md-6">
                    <label class="form-label">Prénom</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="prenom"
                        placeholder="Entrez le prénom"
                    />
                    </div>
                    <!-- Téléphone -->
                    <div class="col-md-6">
                    <label class="form-label">Téléphone</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="telephone"
                        placeholder="Entrez le Téléphone"
                    />
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="email"
                        placeholder="Entrez l'email"
                    />
                    </div>

                    <!-- Nom d'utilisateur -->
                    <div class="col-md-6">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="username"
                        placeholder="Nom d'utilisateur"
                    />
                    </div>

                    <!-- Mot de passe -->
                    <div class="col-md-6">
                    <label class="form-label">Mot de passe</label>
                    <input
                        type="password"
                        class="form-control"
                        formControlName="password"
                        placeholder="Mot de passe"
                    />
                    </div>

                    <!-- Ecoles et rôles -->
                    <div class="col-12" formArrayName="affectations">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label mb-0">Ecoles et rôles</label>
                        <button type="button" class="btn btn-outline-primary btn-sm" (click)="ajouterAffectation()">
                        Ajouter une école
                        </button>
                    </div>
                    <div *ngFor="let affectation of affectations.controls; let i = index" [formGroupName]="i" class="row g-2 mb-2">
                        <div class="col-md-5">
                        <select class="form-select" formControlName="ecole">
                            <option [ngValue]="null">-- Sélectionner une école --</option>
                            <option *ngFor="let ecole of ecoles" [ngValue]="ecole.idEcole">
                            {{ ecole.nomEcole }}
                            </option>
                        </select>
                        </div>
                        <div class="col-md-5">
                        <select class="form-select" formControlName="role">
                            <option [ngValue]="null">-- Sélectionner un rôle --</option>
                            <option *ngFor="let role of roles" [ngValue]="role.id">
                            {{ role.description }}
                            </option>
                        </select>
                        </div>
                        <div class="col-md-2">
                        <button type="button" class="btn btn-outline-danger w-100" (click)="supprimerAffectation(i)" [disabled]="affectations.length === 1">
                            Retirer
                        </button>
                        </div>
                    </div>
                    </div>

                    <!-- Boutons -->
                    <div class="col-12 text-center mt-3">
                    <button type="submit" class="btn btn-primary me-2" [disabled]="adminForm.invalid">
                        {{ editMode ? 'Modifier' : 'Ajouter' }}
                    </button>
                    <button type="button" class="btn btn-secondary" (click)="resetForm()">
                        Annuler
                    </button>
                    </div>
                </div>
                </form>
        </c-card-body>
        </c-card>
    </c-col>
</c-row>
