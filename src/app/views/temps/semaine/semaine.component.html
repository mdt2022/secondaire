<div class="card mb-4">
    <div class="card-header">
        <strong>Gestion des emplois du temps par semaine</strong>
    </div>

    <div class="card-body">
        <form [formGroup]="emploiForm" (ngSubmit)="onSubmit()">
            <div class="row g-3">
                <div class="col-md-3">
                    <select name="professeur" id="" class="form-select" formControlName="professeur">
                        <option [ngValue]="null">-- Sélectionner l’enseignant --</option>
                        <option *ngFor="let e of enseignants" [value]="e.id">{{ e.prenom }} {{ e.nom }}</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select class="form-select" formControlName="anneeuv">
                        <option [ngValue]="null">-- Sélectionner l’année --</option>
                        <option *ngFor="let a of annees" [ngValue]="a.id">
                            {{ a.nom }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <button class="btn btn-primary" type="submit">
                        Rechercher
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

<div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary"></div>
    <p>Chargement...</p>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead class="table-light">
                <tr>
                    <th>N°</th>
                    <th>Jour</th>
                    <th>Classe</th>
                    <th>Matière</th>
                    <th>Arrivé</th>
                    <th>Depart</th>
                    <th>Nmb heure</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let row of emploisTable; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ row.jour }}</td>
                    <td>{{ row.classe.nom }}</td>
                    <td>{{ row.matiere.libelle }}</td>
                    <td>{{ row.heuredebut }}</td>
                    <td>{{ row.heurefin }}</td>
                    <td>{{ calculHeures(row.heuredebut, row.heurefin) }}</td>
                </tr>

                <tr *ngIf="emploisTable.length === 0 && !loading">
                    <td colspan="9" class="text-center text-muted">
                        Aucun emploi du temps trouvé
                    </td>
                </tr>
            </tbody>


        </table>
    </div>
</div>
