<c-card class="mb-4">
  <c-card-header>
    <strong>Gestion des emplois du temps</strong>
  </c-card-header>

  <c-card-body>
    <form [formGroup]="emploiForm" (ngSubmit)="onSubmit()">

      <div class="row g-3">

        <div class="col-md-3">
          <label>Jour</label>
          <select class="form-control" formControlName="jour">
            <option value="">-- Choisir --</option>
            <option *ngFor="let j of jours" [value]="j">{{ j }}</option>
          </select>
        </div>

        <div class="col-md-2">
          <label>Heure début</label>
          <input type="time" class="form-control" formControlName="heuredebut">
        </div>

        <div class="col-md-2">
          <label>Heure fin</label>
          <input type="time" class="form-control" formControlName="heurefin">
        </div>

        <div class="col-md-5">
          <label>Matière</label>
          <select class="form-control" formControlName="matiere">
            <option value="">-- Choisir --</option>
            <option *ngFor="let e of enseignes" [value]="e.matiere.id">
              {{ e.matiere.libelle }} (coef {{ e.matiere.coefficient }})
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label>Enseignant</label>
          <select class="form-control" formControlName="professeur">
            <option value="">-- Choisir --</option>
            <option *ngFor="let p of enseignants" [value]="p.id">
              {{ p.prenom }} {{ p.nom }}
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label>Classe</label>
          <select class="form-control" formControlName="classe">
            <option value="">-- Choisir --</option>
            <option *ngFor="let c of classes" [value]="c.id">
              {{ c.nom }}
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label>Année universitaire</label>
          <select class="form-control" formControlName="anneeuv">
            <option value="">-- Choisir --</option>
            <option *ngFor="let a of anneeuvs" [value]="a.id">
              {{ a.nom }}
            </option>
          </select>
        </div>

      </div>

      <div class="mt-3">
        <button class="btn btn-primary" type="submit">
          {{ editMode ? 'Modifier' : 'Enregistrer' }}
        </button>
        <button class="btn btn-secondary ms-2" type="button" (click)="resetForm()">
          Annuler
        </button>
      </div>

    </form>
  </c-card-body>
</c-card>

<c-card>
  <c-card-body>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Jour</th>
          <th>Heure</th>
          <th>Matière</th>
          <th>Professeur</th>
          <th>Classe</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let e of emplois">
          <td>{{ e.jour }}</td>
          <td>{{ e.heuredebut }} - {{ e.heurefin }}</td>
          <td>{{ e.matiere?.libelle }}</td>
          <td>{{ e.professeur?.prenom }} {{ e.professeur?.nom }}</td>
          <td>{{ e.classe?.nom }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="edit(e)">✏️</button>
            <button class="btn btn-danger btn-sm ms-2" (click)="delete(e.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>
