<c-card class="mb-4 shadow-sm border-0">
  <c-card-header class="d-flex justify-content-between align-items-center bg-white py-3">
    <strong>{{ editMode ? 'Modifier l\'emploi du temps' : 'Création emploi du temps' }}</strong>
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="backToList()">
      ⬅ Retour à la liste
    </button>
  </c-card-header>

  <c-card-body>
    <form [formGroup]="emploiForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">

        <div class="col-md-3">
          <label class="form-label fw-semibold">Jour</label>
          <select class="form-select" formControlName="jour">
            <option value="">-- Choisir --</option>
            <option *ngFor="let j of jours" [value]="j">{{ j }}</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold">Heure début</label>
          <input type="time" class="form-control" formControlName="heuredebut">
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold">Heure fin</label>
          <input type="time" class="form-control" formControlName="heurefin">
        </div>

        <div class="col-md-5">
          <label class="form-label fw-semibold">Matière</label>
          <select class="form-select" formControlName="matiere">
            <option value="">-- Choisir --</option>
            <option *ngFor="let e of enseignes" [value]="e.matiere.id">
              {{ e.matiere.libelle }} | Coef {{ e.matiere.coefficient }} | Horaire {{ e.matiere.horaire }} h
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Enseignant</label>
          <select class="form-select" formControlName="enseignant">
            <option value="">-- Choisir --</option>
            <option *ngFor="let ens of enseignants" [value]="ens.id">
              {{ ens.prenom }} {{ ens.nom }}
            </option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Classe</label>
          <select class="form-select" formControlName="classe" (change)="verifierEffectifClasse()">
            <option value="">-- Choisir --</option>
            <option *ngFor="let c of classes" [value]="c.id">{{ c.nom }}</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Année universitaire</label>
          <select class="form-select" formControlName="anneeuv" (change)="verifierEffectifClasse()">
            <option value="">-- Choisir --</option>
            <option *ngFor="let a of anneeuvs" [value]="a.id">{{ a.nom }}</option>
          </select>
        </div>
      </div>

      <!-- Message vérification effectif -->
      <div class="col-12 mt-2" *ngIf="emploiForm.get('classe')?.value && emploiForm.get('anneeuv')?.value">
        <div *ngIf="verificationEffectifEnCours" class="form-text text-info">
          Vérification de l’effectif de la classe...
        </div>
        <div *ngIf="!verificationEffectifEnCours && effectifClasse === 0" class="form-text text-danger">
          Attention : Cette classe n'a aucun effectif pour cette année universitaire.
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"
                [disabled]="emploiForm.invalid || verificationEffectifEnCours || (!editMode && effectifClasse === 0)">
          {{ editMode ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">
          Réinitialiser
        </button>
      </div>
    </form>
  </c-card-body>
</c-card>
