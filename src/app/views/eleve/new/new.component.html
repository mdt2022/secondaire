<div class="card p-4 shadow-sm mx-auto" style="max-width: 1200px;">
  <h4 class="mb-4 text-primary">
    <i class="fa fa-user-plus me-2"></i>Enregistrer et affecter un élève
  </h4>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row g-4">
<!-- Informations personnelles et parents -->
<div formGroupName="eleve" class="col-12">

  <!-- Informations personnelles -->
  <div class="mb-4">
    <h5 class="mb-3 text-secondary">
      <i class="fa fa-id-card me-2"></i>Informations personnelles
    </h5>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Matricule</label>
        <input type="text" class="form-control" formControlName="matricule">
      </div>
      <div class="col-md-3">
        <label class="form-label">Nom</label>
        <input type="text" class="form-control" formControlName="nom">
      </div>
      <div class="col-md-3">
        <label class="form-label">Prénom</label>
        <input type="text" class="form-control" formControlName="prenom">
      </div>
      <div class="col-md-3">
        <label class="form-label">Nationalité</label>
        <input type="text" class="form-control" formControlName="nationalite">
      </div>
      <div class="col-md-4">
        <label class="form-label">Date de naissance</label>
        <input type="date" class="form-control" formControlName="datedn">
      </div>
      <div class="col-md-4">
        <label class="form-label">Lieu de naissance</label>
        <input type="text" class="form-control" formControlName="lieudn">
      </div>
      <div class="col-md-4">
        <label class="form-label">Sexe</label>
        <select class="form-select" formControlName="sexe">
          <option value="">-- Sélectionner --</option>
          <option value="M">Masculin</option>
          <option value="F">Féminin</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Informations parents -->
  <div class="mb-4">
    <h5 class="mb-3 text-secondary">
      <i class="fa fa-users me-2"></i>Informations des parents
    </h5>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Prénom père</label>
        <input type="text" class="form-control" formControlName="prenompere">
      </div>
      <div class="col-md-4">
        <label class="form-label">Prénom mère</label>
        <input type="text" class="form-control" formControlName="prenommere">
      </div>
      <div class="col-md-4">
        <label class="form-label">Nom mère</label>
        <input type="text" class="form-control" formControlName="nommere">
      </div>
    </div>
  </div>

</div>


      <!-- Affectation -->
      <div class="col-12 mt-4">
        <h5 class="mb-3 text-secondary"><i class="fa fa-map-marker-alt me-2"></i>Affectation</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Classe</label>
            <select class="form-select" formControlName="classe">
              <option [ngValue]="null">-- Sélectionner une classe --</option>
              <option *ngFor="let c of classes" [ngValue]="c">{{ c.nom }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Année</label>
            <select class="form-select" formControlName="anneeuv">
              <option [ngValue]="null">-- Sélectionner une année --</option>
              <option *ngFor="let a of annees" [ngValue]="a">{{ a.nom }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Académie</label>
            <select class="form-select" formControlName="academie">
              <option [ngValue]="null">-- Sélectionner --</option>
              <option *ngFor="let ac of academies" [ngValue]="ac">{{ ac.libelle }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bouton -->
      <div class="col-12 mt-4 text-end">
        <button type="submit" class="btn btn-primary px-4" [disabled]="loading || form.invalid">
          <i class="fa" [ngClass]="loading ? 'fa-spinner fa-spin me-2' : 'fa-save me-2'"></i>
          {{ loading ? 'Enregistrement...' : 'Enregistrer et affecter' }}
        </button>
      </div>

    </div>
  </form>
</div>
