<div class="container mt-4">
  <div class="row g-4 justify-content-center">

    <!-- Lien 1 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a [routerLink]="['../new']" class="btn btn-outline-primary w-100 d-flex flex-column align-items-center justify-content-center p-4 text-decoration-none shadow-sm hover-scale">

        <span class="fw-bold text-center">INSCRIPTION D'UN ELEVE</span>
      </a>
    </div>

    <!-- Lien 2 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a [routerLink]="['../liste']" class="btn btn-outline-success w-100 d-flex flex-column align-items-center justify-content-center p-4 text-decoration-none shadow-sm hover-scale">
        <i class="fas fa-calendar fa-3x mb-2 text-success"></i>
        <span class="fw-bold text-center">LES ELEVES PAR CLASSE</span>
      </a>
    </div>

    <!-- Lien 3 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">

        <span class="fw-bold text-center">PASSAGE DES ELEVES</span>
      </a>
    </div>

    <!-- Lien 4 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a [routerLink]="['../redoublement']" class="btn btn-outline-info w-100 d-flex flex-column align-items-center justify-content-center p-4 text-decoration-none shadow-sm hover-scale">
        <i class="fas fa-chalkboard-teacher fa-3x mb-2 text-info"></i>
        <span class="fw-bold text-center">REDOUBLEMENT</span>
      </a>
    </div>

    <!-- Lien 5 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a [routerLink]="['../validation']" class="btn btn-outline-danger w-100 d-flex flex-column align-items-center justify-content-center p-4 text-decoration-none shadow-sm hover-scale">

    <!-- Lien 7 -->

        <span class="fw-bold text-center">ADMIS AUX EXAMENS</span>
      </a>
    </div>

    <!-- Lien 8 -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a [routerLink]="['../statistique']" class="btn btn-outline-success w-100 d-flex flex-column align-items-center justify-content-center p-4 text-decoration-none shadow-sm hover-scale">
        <i class="fas fa-chart-bar fa-3x mb-2 text-success"></i>
