<div class="container mt-4">

    <div class="row g-4">

        <div class="col-lg-8">

            <div class="row g-3">
                <!-- Lien 1 -->
                <div class="col-6">
                    <a [routerLink]="['../new']" class="btn btn-outline-primary w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-home fa-2x mb-2"></i>
                        <span class="fw-bold text-center">INSCRIPTION</span>
                    </a>
                </div>
                <!-- Lien 2 -->
                <div class="col-6">
                    <a [routerLink]="['../liste']" class="btn btn-outline-success w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-calendar fa-2x mb-2"></i>
                        <span class="fw-bold text-center">PAR CLASSE</span>
                    </a>
                </div>
                <!-- Lien 3 -->
                <div class="col-6">
                    <a [routerLink]="['../passage']" class="btn btn-outline-warning w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-users fa-2x mb-2"></i>
                        <span class="fw-bold text-center">PASSAGE</span>
                    </a>
                </div>
                <!-- Lien 4 -->
                <div class="col-6">
                    <a [routerLink]="['../redoublement']" class="btn btn-outline-info w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-chalkboard-teacher fa-2x mb-2"></i>
                        <span class="fw-bold text-center">REDOUBLEMENT</span>
                    </a>
                </div>
                <!-- Lien 5 -->
                <div class="col-6">
                    <a [routerLink]="['../validation']" class="btn btn-outline-danger w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-book fa-2x mb-2"></i>
                        <span class="fw-bold text-center">VALIDATION</span>
                    </a>
                </div>
                <!-- Lien 6 -->
                <div class="col-6">
                    <a [routerLink]="['../exclusion']" class="btn btn-outline-secondary w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-building fa-2x mb-2"></i>
                        <span class="fw-bold text-center">EXCLUSION</span>
                    </a>
                </div>
                <!-- Lien 7 -->
                <div class="col-6">
                    <a [routerLink]="['../admis']" class="btn btn-outline-primary w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-cog fa-2x mb-2"></i>
                        <span class="fw-bold text-center">ADMIS</span>
                    </a>
                </div>
                <!-- Lien 8 -->
                <div class="col-6">
                    <a [routerLink]="['../statistique']" class="btn btn-outline-success w-100 p-3 shadow-sm d-flex flex-column align-items-center">
                        <i class="fas fa-chart-bar fa-2x mb-2"></i>
                        <span class="fw-bold text-center">STATISTIQUE</span>
                    </a>
                </div>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white text-center py-2">
                    <h6 class="mb-0 fw-bold">Nombre d'élèves par classe</h6>
                </div>

                <div class="card-body p-2">
                    <div class="table-container" style="max-height: 350px; overflow-y: auto;">
                        <table class="table table-sm table-hover text-center mb-2">
                            <thead class="table-light">
                                <tr>
                                    <th>Classe</th>
                                    <th>Effectif</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr *ngFor="let c of stats">
                                    <td class="fw-semibold">{{ c.nom }}</td>
                                    <td>
                                        <span class="badge bg-success px-3 py-1">
                        {{ c.nombre }}
                    </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center mt-2">
                        <span class="badge bg-danger px-3 py-2">
              Total : {{ totalEleves }}
            </span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
