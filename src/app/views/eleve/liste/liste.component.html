<div class="card mb-4">
  <div class="card-header"><strong>Gestion des inscriptions</strong></div>
  <div class="card-body">
    <form [formGroup]="eleveecoleForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">        

        <div class="col-md-3">
          <select class="form-select" formControlName="classe">
            <option [ngValue]="null">-- Sélectionner la Classe --</option>
            <option *ngFor="let c of classes" [ngValue]="c.id">{{ c.nom }}</option>
          </select>
        </div>

        <div class="col-md-3">
          <select class="form-select" formControlName="anneeuv">
            <option [ngValue]="null">-- Sélectionner une Année --</option>
            <option *ngFor="let a of annees" [ngValue]="a.id">{{ a.nom }}</option>
          </select>
        </div>

        <div class="col-md-3">
          <button type="submit" class="btn btn-primary">Rechercher</button>
          <button type="button" class="btn btn-secondary ms-2" (click)="resetForm()">Annuler</button>
        </div>
        
      </div>      
    </form>
  </div>
</div>

<hr />

<div class="card">
  <div class="card-body">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Élève</th>
          <th>École</th>
          <th>Classe</th>
          <th>Année</th>
          <th>Académie</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of eleves">
          <td>{{ e.eleve.matricule }} {{ e.eleve.nom }} {{ e.eleve.prenom }}</td>
          <td>{{ e.ecole.nomEcole }}</td>
          <td>{{ e.classe.nom }}</td>
          <td>{{ e.anneeuv.nom }}</td>
          <td>{{ e.academie.libelle }}</td>
          <td>
            <a class="btn btn-warning btn-sm" [routerLink]="['/eleve/new', e.id]">✏️</a>
            <button class="btn btn-danger btn-sm ms-2" (click)="delete(e.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
