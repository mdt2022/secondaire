<c-card>
  <c-card-header>
    <strong>Gestion des matières</strong>
  </c-card-header>

  <c-card-body>
    <form [formGroup]="matiereForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-4">
          <label>Libellé</label>
          <input class="form-control" formControlName="libelle" placeholder="Nom de la matière" />
        </div>
        <div class="col-md-4">
          <label>Coefficient</label>
          <input class="form-control" type="number" formControlName="coefficient" placeholder="Coefficient" />
        </div>
        <div class="col-md-4">
          <label>Horaire</label>
          <input class="form-control" type="number" formControlName="horaire" placeholder="Nombre d'heures" />
        </div>
      </div>

      <div class="mt-3">
        <button class="btn btn-primary" type="submit">
          {{ editMode ? 'Modifier' : 'Ajouter' }}
        </button>
        <button class="btn btn-secondary ms-2" type="button" (click)="resetForm()">Annuler</button>
      </div>
    </form>
  </c-card-body>
</c-card>

<hr />

<c-card>
  <c-card-body>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Libellé</th>
          <th>Coefficient</th>
          <th>Horaire</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of matieres">
          <td>{{ m.libelle }}</td>
          <td>{{ m.coefficient }}</td>
          <td>{{ m.horaire }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="edit(m)">✏️</button>
            <button class="btn btn-danger btn-sm ms-2" (click)="delete(m.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>
