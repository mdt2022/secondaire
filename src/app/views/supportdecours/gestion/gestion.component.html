<div>
    <h5 class="mb-3">Liste des supports</h5>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Type</th>
                <th>Structure</th>
                <th>Fichiers</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody cdkDropList (cdkDropListDropped)="drop($event)">
            <tr *ngFor="let s of supports; let i = index" cdkDrag>
                <td>{{ i + 1 }}</td>
                <td>{{ s.nom }}</td>
                <td>{{ s.type }}</td>
                <td>{{ s.structure }}</td>
                <td>
                    <!-- Fichier principal -->
                    <div *ngIf="s.nomfichier">
                        <a [href]="backendUrl + s.nomfichier" target="_blank">Voir</a>
                    </div>

                    <!-- Chapitres -->
                    <div *ngIf="s.chapitres?.length">
                        <div *ngFor="let c of s.chapitres">
                            <a [href]="backendUrl + c.fichier" target="_blank">{{ c.titre }}</a>
                        </div>
                    </div>
                </td>
                <td>
                    <button class="btn btn-danger btn-sm me-1" (click)="delete(s.id)">Suppr</button>
                    <button class="btn btn-primary btn-sm" [routerLink]="['/supports/edit', s.id]">Modifier</button>
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="supports.length === 0" class="text-muted mt-3">
        Aucun support disponible pour cette matière.
    </div>
</div>
