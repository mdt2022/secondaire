<div class="container-fluid">
  <div class="row">
    <!-- CONTENU PRINCIPAL -->
    <main class="col-md-12 ms-sm-auto col-lg-12 px-md-4 py-4">
      <!-- En-tête -->
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Vue d'ensemble</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
          <button type="button" class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-download"></i> Exporter
          </button>
          <button type="button" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-lg"></i> Nouveau Token
          </button>
        </div>
      </div>
      <!-- CARTES DE STATISTIQUES -->
      <div class="row row-cols-1 row-cols-md-3 g-4 mb-4">
        <!-- Carte 1 -->
        <div class="col">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body d-flex align-items-center">
              <div class="bg-primary-subtle text-primary p-3 rounded-3 me-3">
                <i class="bi bi-people fs-3"></i>
              </div>
              <div>
                <h6 class="card-subtitle text-muted mb-1">Total Utilisateurs</h6>
                <h4 class="card-title mb-0 fw-bold">1,245</h4>
              </div>
            </div>
          </div>
        </div>
        <!-- Carte 2 -->
        <div class="col">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body d-flex align-items-center">
              <div class="bg-success-subtle text-success p-3 rounded-3 me-3">
                <i class="bi bi-shield-check fs-3"></i>
              </div>
              <div>
                <h6 class="card-subtitle text-muted mb-1">Admins Actifs</h6>
                <h4 class="card-title mb-0 fw-bold">12</h4>
              </div>
            </div>
          </div>
        </div>
        <!-- Carte 3 -->
        <div class="col">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body d-flex align-items-center">
              <div class="bg-warning-subtle text-warning p-3 rounded-3 me-3">
                <i class="bi bi-key fs-3"></i>
              </div>
              <div>
                <h6 class="card-subtitle text-muted mb-1">Tokens Générés</h6>
                <h4 class="card-title mb-0 fw-bold">89</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- TABLEAU DE DONNÉES -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
          <h5 class="card-title mb-0 fw-bold">Dernières connexions administrateurs</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nom d'utilisateur</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Statut Token</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let a of administrateurs">
                <td>{{ a.id }}</td>
                <td>{{ a.nom }} {{ a.prenom }}</td>
                <td>{{ a.ecole.nomEcole }}</td>
                <td><span class="badge bg-danger">{{ a.role.nom }}</span></td>
                <td>
                  <span class="badge" [ngClass]="a.online ? 'bg-success' : 'bg-secondary'">
                    {{ a.online ? 'En ligne' : 'Hors ligne' }}
                  </span>
                </td>
                <td><button class="btn btn-sm btn-outline-primary">Gérer</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
