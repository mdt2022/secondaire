<div class="container mt-4">
  <h3 class="mb-3">Gestion des Classes</h3>

  <form [formGroup]="classeForm" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-3">
        <input formControlName="nom" type="text" class="form-control" placeholder="Nom" required>
      </div>
      <div class="col-md-3">
        <input formControlName="filiere" type="text" class="form-control" placeholder="Filière">
      </div>
      <div class="col-md-3">
        <input formControlName="options" type="text" class="form-control" placeholder="Options">
      </div>
      <div class="col-md-3">
        <input formControlName="description" type="text" class="form-control" placeholder="Description">
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary me-2">{{ editMode ? 'Modifier' : 'Ajouter' }}</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Annuler</button>
    </div>
  </form>

  <table class="table table-striped mt-4">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Filière</th>
        <th>Options</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let classe of classes">
        <td>{{ classe.nom }}</td>
        <td>{{ classe.filiere }}</td>
        <td>{{ classe.options }}</td>
        <td>{{ classe.description }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="edit(classe)">Modifier</button>
          <button class="btn btn-sm btn-danger" (click)="delete(classe.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
