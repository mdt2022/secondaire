<div class="card mb-4">
  <div class="card-header">
    <strong>Gestion des Frais Scolaires</strong>
  </div>

  <div class="card-body">
    <form [formGroup]="fraisForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <!-- École -->
        <div class="col-md-3">
          <label>École</label>
          <select class="form-select" formControlName="ecole">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let e of ecoles" [ngValue]="e">{{ e.nomEcole }}</option>
          </select>
        </div>

        <!-- Classe -->
        <div class="col-md-3">
          <label>Classe</label>
          <select class="form-select" formControlName="classe">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let c of classes" [ngValue]="c">{{ c.nom }}</option>
          </select>
        </div>

        <!-- Élève -->
        <div class="col-md-3">
          <label>Élève</label>
          <select class="form-select" formControlName="eleve">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let ele of eleves" [ngValue]="ele">{{ ele.nom }} {{ ele.prenom }}</option>
          </select>
        </div>

        <!-- Année -->
        <div class="col-md-3">
          <label>Année</label>
          <select class="form-select" formControlName="anneeuv">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let a of annees" [ngValue]="a">{{ a.nom }}</option>
          </select>
        </div>

        <!-- Montant -->
        <div class="col-md-3">
          <label>Montant</label>
          <input type="number" class="form-control" formControlName="montant" />
        </div>

        <!-- Réduction -->
        <div class="col-md-3">
          <label>Réduction</label>
          <input type="number" class="form-control" formControlName="reduction" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">
          {{ editMode ? 'Modifier' : 'Ajouter' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="resetForm()">Annuler</button>
      </div>
    </form>
  </div>
</div>

<hr />

<div class="card">
  <div class="card-body">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>École</th>
          <th>Classe</th>
          <th>Élève</th>
          <th>Année</th>
          <th>Montant</th>
          <th>Réduction</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of fraisList">
          <td>{{ f.ecole.nomEcole }}</td>
          <td>{{ f.classe.nom }}</td>
          <td>{{ f.eleve.nom }} {{ f.eleve.prenom }}</td>
          <td>{{ f.anneeuv.nom }}</td>
          <td>{{ f.montant }}</td>
          <td>{{ f.reduction }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="edit(f)">✏️</button>
            <button class="btn btn-danger btn-sm ms-2" (click)="delete(f.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
