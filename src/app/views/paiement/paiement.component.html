<div class="card mb-4">
  <div class="card-header"><strong>Gestion des Paiements</strong></div>
  <div class="card-body">
    <form [formGroup]="paiementForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-3">
          <label>École</label>
          <select class="form-select" formControlName="ecole">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let e of ecoles" [ngValue]="e">{{ e.nomEcole }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>Classe</label>
          <select class="form-select" formControlName="classe">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let c of classes" [ngValue]="c">{{ c.nom }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>Élève</label>
          <select class="form-select" formControlName="eleve">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let ele of eleves" [ngValue]="ele">{{ ele.nom }} {{ ele.prenom }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>Année</label>
          <select class="form-select" formControlName="anneeuv">
            <option [ngValue]="null">-- Sélectionner --</option>
            <option *ngFor="let a of annees" [ngValue]="a">{{ a.nom }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>Montant</label>
          <input type="number" class="form-control" formControlName="montant" />
        </div>
        <div class="col-md-3">
          <label>En lettre</label>
          <input type="text" class="form-control" formControlName="enlettre" />
        </div>
        <div class="col-md-3">
          <label>Motif</label>
          <input type="text" class="form-control" formControlName="motif" />
        </div>
        <div class="col-md-3">
          <label>Numéro reçu</label>
          <input type="text" class="form-control" formControlName="numerorecu" />
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Modifier' : 'Ajouter' }}</button>
        <button type="button" class="btn btn-secondary ms-2" (click)="resetForm()">Annuler</button>
      </div>
    </form>
  </div>
</div>

<hr />

<div class="card">
  <div class="card-body">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>École</th>
          <th>Classe</th>
          <th>Élève</th>
          <th>Année</th>
          <th>Montant</th>
          <th>En lettre</th>
          <th>Motif</th>
          <th>Numéro reçu</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of paiementList">
          <td>{{ p.ecole?.nomEcole }}</td>
          <td>{{ p.classe?.nom }}</td>
          <td>{{ p.eleve?.nom }} {{ p.eleve?.prenom }}</td>
          <td>{{ p.anneeuv?.nom }}</td>
          <td>{{ p.montant }}</td>
          <td>{{ p.enlettre }}</td>
          <td>{{ p.motif }}</td>
          <td>{{ p.numerorecu }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="edit(p)">✏️</button>
            <button class="btn btn-danger btn-sm ms-2" (click)="delete(p.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
