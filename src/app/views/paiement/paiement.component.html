<div class="container mt-4">

    <h3 class="mb-3">Gestion des Paiements Secondaires</h3>

    <form [formGroup]="form" (ngSubmit)="save()" class="card p-3 mb-4">
        <div class="row">
            <div class="col-md-3">
                <label>Année</label>
                <select class="form-control" formControlName="anneeId">
                    <option value="">-- Sélectionner --</option>
                    <option *ngFor="let a of annees" [value]="a.id">{{ a.nom }}</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Classe</label>
                <select class="form-control" formControlName="classeId">
                    <option value="">-- Sélectionner --</option>
                    <option *ngFor="let c of classes" [value]="c.id">{{ c.nom }}</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Élève</label>
                <select class="form-control" formControlName="eleveId">
                    <option value="">-- Sélectionner --</option>
                    <option *ngFor="let e of eleves" [value]="e.id">{{ e.nom }} {{ e.prenom }}</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Numéro Reçu</label>
                <input type="text" class="form-control" formControlName="numerorecu">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-3">
                <label>Montant</label>
                <input type="number" class="form-control" formControlName="montant">
            </div>
            <div class="col-md-3">
                <label>Montant en lettre</label>
                <input type="text" class="form-control" formControlName="enlettre">
            </div>
            <div class="col-md-3">
                <label>Date Paiement</label>
                <input type="date" class="form-control" formControlName="datepaie">
            </div>
            <div class="col-md-3">
                <label>Motif</label>
                <input type="text" class="form-control" formControlName="motif">
            </div>
        </div>

        <div class="mt-3">
            <button class="btn btn-primary me-2" type="submit">{{ editMode ? 'Modifier' : 'Enregistrer' }}</button>
            <button type="button" class="btn btn-secondary me-2" (click)="search()">Rechercher</button>
            <button type="button" class="btn btn-warning" (click)="reset()">Réinitialiser</button>
        </div>
    </form>

    <table class="table table-bordered table-striped" *ngIf="paiements.length > 0">
        <thead class="table-light">
            <tr>
                <th>Id</th>
                <th>Montant</th>
                <th>Élève</th>
                <th>Date</th>
                <th>Lettre</th>
                <th>Année</th>
                <th>Motif</th>
                <th>Classe</th>
                <th>Reçu</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let p of paiements | paginate: { itemsPerPage: pageSize, currentPage: page }">
                <td>{{ p.id }}</td>
                <td>{{ p.montant }}</td>
                <td>{{ p.eleve.nom }} {{ p.eleve.prenom }}</td>
                <td>{{ p.datepaie | date:'dd/MM/yyyy' }}</td>
                <td>{{ p.enlettre }}</td>
                <td>{{ p.anneeuv.nom }}</td>
                <td>{{ p.motif }}</td>
                <td>{{ p.classe.nom }}</td>
                <td>{{ p.numerorecu }}</td>
                <td>
                    <button class="btn btn-sm btn-info me-2" (click)="edit(p)">Modifier</button>
                    <button class="btn btn-sm btn-danger" (click)="delete(p.id)">Supprimer</button>
                </td>
            </tr>
        </tbody>
    </table>
    <pagination-controls (pageChange)="page = $event" [autoHide]="true" class="mt-2" *ngIf="paiements.length > pageSize">
    </pagination-controls>

</div>
