<div class="page-header mb-4">
    <h1>Gestion des relevés de {{ etablissement }}</h1>
</div>

<div class="row mb-3 g-3">

    <div class="col-md-2">
        <label class="form-label">Classe</label>
        <select class="form-select" [(ngModel)]="classeecoleId" name="classeecoleId">
            <option value="">-- Choisir --</option>
            <option *ngFor="let c of classes" [value]="c.id">{{ c.nom }}</option>
        </select>
    </div>

    <div class="col-md-2">
        <label class="form-label">Période</label>
        <select class="form-select" [(ngModel)]="periodeId" name="periodeId">
            <option value="">-- Choisir --</option>
            <option *ngFor="let p of periodes" [value]="p.id">{{ p.libelle }}</option>
        </select>
    </div>

    <div class="col-md-2">
        <label class="form-label">Année</label>
        <select class="form-select" [(ngModel)]="anneeId" name="anneeId">
            <option value="">-- Choisir --</option>
            <option *ngFor="let a of annees" [value]="a.id">{{ a.nom }}</option>
        </select>
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-info w-100" (click)="produire()">Produire</button>
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-success w-100" (click)="imprimer()" [disabled]="eleves.length === 0">
            Imprimer
        </button>
    </div>

</div>

<div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border text-primary"></div>
    <p>Chargement des élèves...</p>
</div>

<table class="table table-bordered table-striped" *ngIf="eleves.length > 0">
    <thead class="table-primary">
        <tr>
            <th>N°</th>
            <th>Matricule</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Note de Classe / 40</th>
            <th>Note de Compo / 20</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let eleve of eleves; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ eleve.matricule }}</td>
            <td>{{ eleve.prenom }}</td>
            <td>{{ eleve.nom }}</td>
            <td>{{ eleve.noteClasse || '-' }}</td>
            <td>{{ eleve.noteCompo || '-' }}</td>
        </tr>
    </tbody>
</table>
