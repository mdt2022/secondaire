<div class="card p-3 shadow-sm rounded" style="background-color: #fff;">

    <div class="row g-2">

        <div class="col-md-3">
            <select class="form-select" [(ngModel)]="selectedAnnee" style="height: 40px;">
        <option value="" disabled selected>Année</option>
        <option *ngFor="let a of annees" [ngValue]="a.id">{{ a.nom }}</option>
      </select>
        </div>

        <div class="col-md-3">
            <select class="form-select" [(ngModel)]="selectedClasse" (change)="chargerEleves()" style="height: 40px;">
        <option value="" disabled selected>Classe</option>
        <option *ngFor="let c of classes" [ngValue]="c.id">{{ c.nom }}</option>
      </select>
        </div>

        <div class="col-md-3">
            <select class="form-select" [(ngModel)]="selectedEleve" style="height: 40px;">
        <option value="" disabled selected>Élève</option>
        <option *ngFor="let e of eleves" [ngValue]="e.eleve.id">
          {{ e.eleve.matricule }} {{ e.eleve.prenom }} {{ e.eleve.nom }}
        </option>
      </select>
        </div>

        <div class="col-md-3">
            <select class="form-select" [(ngModel)]="selectedPeriode" style="height: 40px;">
        <option value="" disabled selected>Période</option>
        <option *ngFor="let p of periodes" [ngValue]="p.id">{{ p.libelle }}</option>
      </select>
        </div>

    </div>

    <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-primary" (click)="afficherBulletin()" [disabled]="!selectedEleve || !selectedAnnee || !selectedClasse || !selectedPeriode" style="min-width: 120px;">
      Afficher
    </button>

        <button class="btn btn-success" (click)="imprimer()" *ngIf="bulletin" style="min-width: 120px;">
      Imprimer
    </button>
    </div>

</div>

<hr>

<div *ngIf="bulletin" class="table-responsive mt-3">
    <table class="table table-bordered table-striped align-middle" style="font-size: 14px;">
        <thead class="table-light text-center">
            <tr>
                <th>Matière</th>
                <th>Moy Classe</th>
                <th>Moy Compo</th>
                <th>Moy G.</th>
                <th>Coeff</th>
                <th>Moy Coeff</th>
                <th>Mention</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let n of bulletin.notes">
                <td class="text-start">{{n.matiere.libelle}}</td>
                <td>{{n.noteClasse}}</td>
                <td>{{n.noteCompo}}</td>
                <td>{{n.mg}}</td>
                <td>{{n.matiere.coefficient}}</td>
                <td>{{n.mgc}}</td>
                <td>{{n.mention}}</td>
            </tr>
        </tbody>
    </table>

    <p><strong>Total:</strong> {{bulletin.total}}</p>
    <p><strong>Moyenne:</strong> {{bulletin.moyg}}</p>
    <p><strong>Observation:</strong> {{bulletin.observation}}</p>
</div>
