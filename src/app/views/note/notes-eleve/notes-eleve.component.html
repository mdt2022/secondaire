<div class="container py-4">

    <!-- EN-TÊTE DE LA PAGE -->
    <div class="page-header mb-4 bg-white p-4 rounded-4 shadow-sm border-start border-primary border-4 animate-fade-in">
        <h1 class="h3 fw-extrabold text-dark mb-1">Enregistrer une note</h1>
        <p class="text-muted mb-0 small text-uppercase tracking-wider fw-semibold">{{ etablissement }}</p>
    </div>

    <!-- SÉLECTION DU CONTEXTE (ÉLÈVE / CLASSE) -->
    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mb-3 animate-fade-in">
        <span class="badge bg-light-primary text-primary px-3 py-2 rounded-pill fw-bold mb-3 d-inline-block align-self-start style-badge">1. Contexte & Élève</span>
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Période</label>
                <select [(ngModel)]="periodeId" class="form-select border-2 custom-select shadow-2xs">
                    <option [ngValue]="null">Choisir...</option>
                    <option *ngFor="let p of periodes" [ngValue]="p.id">{{ p.libelle }}</option>
                </select>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Année scolaire</label>
                <select [(ngModel)]="anneeId" class="form-select border-2 custom-select shadow-2xs" (change)="chargerEleves()">
                    <option [ngValue]="null">Choisir...</option>
                    <option *ngFor="let a of annees" [ngValue]="a.id">{{ a.nom }}</option>
                </select>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Classe</label>
                <select [(ngModel)]="classeEcoleId" class="form-select border-2 custom-select shadow-2xs" (change)="chargerEleves()">
                    <option [ngValue]="null">Choisir...</option>
                    <option *ngFor="let c of classes" [ngValue]="c.id">{{ c.nom }}</option>
                </select>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Élève</label>
                <select [(ngModel)]="eleveEcoleId" class="form-select border-2 custom-select shadow-2xs">
                    <option [ngValue]="null">Choisir...</option>
                    <option *ngFor="let e of eleves" [ngValue]="e.id">{{ e.eleve.nom }} {{ e.eleve.prenom }}</option>
                </select>
            </div>
        </div>
    </div>

    <!-- SAISIE DE LA NOTE -->
    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white animate-fade-in">
        <span class="badge bg-light-success text-success px-3 py-2 rounded-pill fw-bold mb-3 d-inline-block align-self-start style-badge">2. Évaluation & Validation</span>
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Matière</label>
                <select [(ngModel)]="matiereId" class="form-select border-2 custom-select shadow-2xs">
                    <option [ngValue]="null">Choisir...</option>
                    <option *ngFor="let m of matieres" [ngValue]="m.id">{{ m.libelle }}</option>
                </select>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Note de classe</label>
                <div class="input-group rounded-3 shadow-2xs overflow-hidden border-2 input-group-container">
                    <input type="number" class="form-control border-0 fw-semibold custom-input" placeholder="Ex: 14.5" [(ngModel)]="noteClasse" min="0" max="20" step="0.25">
                    <span class="input-group-text bg-white border-0 text-muted small px-3">/20</span>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Note de compo</label>
                <div class="input-group rounded-3 shadow-2xs overflow-hidden border-2 input-group-container">
                    <input type="number" class="form-control border-0 fw-semibold custom-input" placeholder="Ex: 12.0" [(ngModel)]="noteCompo" min="0" max="20" step="0.25">
                    <span class="input-group-text bg-white border-0 text-muted small px-3">/20</span>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <button class="btn btn-primary fw-bold w-100 custom-btn shadow-sm" (click)="enregistrerNote()">
                    <i class="fas fa-check-circle me-2"></i>Enregistrer
                </button>
            </div>
        </div>
    </div>

    <!-- MESSAGES DE NOTIFICATION -->
    <div *ngIf="message" class="alert mt-3 border-0 shadow-sm rounded-3 animate-fade-in p-3 d-flex align-items-center" 
         [ngClass]="{ 'bg-light-success text-success': success, 'bg-light-danger text-danger': !success }">
        <i class="fas me-3 fs-5" [ngClass]="{ 'fa-check-circle': success, 'fa-exclamation-circle': !success }"></i>
        <div class="fw-semibold">{{ message }}</div>
    </div>

</div>
