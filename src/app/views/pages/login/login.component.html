<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" cForm>
                <h1>Administration</h1>
                <p *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</p>
                <p class="text-body-secondary">Espace Administration du secondaire</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input 
                  autoComplete="username" 
                  cFormControl 
                  formControlName = "username"
                  placeholder="Identifiant" />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Mot de passe"
                    type="password"
                    formControlName = "password"
                  />
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button 
                      type="submit" 
                      cButton 
                      class="px-4 d-flex align-items-center justify-content-center" 
                      color="primary" 
                      [disabled]="loading">

                      <span *ngIf="!loading">Connexion</span>
                      <span *ngIf="loading" class="d-flex align-items-center">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Chargement...
                      </span>

                    </button>

                  </c-col>
                  <c-col class="text-right" xs="6">
                    <button cButton class="px-0" color="link">
                      Mot de passe oublié ?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card class="imgdes">
            <c-card-body class="text-center">
              <!--
              <h2>Espace Parents</h2>
              <p>Bientôt disponible !</p>
              <button cButton color="light" class="mt-3" routerLink="/register">
                Soyez patients !
              </button>
              -->
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
